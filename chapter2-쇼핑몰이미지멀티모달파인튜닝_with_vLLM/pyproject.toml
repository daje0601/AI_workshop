[project]
name = "vlm-env"
version = "0.1.0"
description = "Qwen3-VL fine-tuning environment (PyTorch 2.8 + cu128)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers>=4.57.0,<5.0.0",
    "accelerate>=1.1.0,<2.0.0",
    "datasets>=3.0.1,<4.0.0",
    "evaluate>=0.4.3,<1.0.0",
    "trl>=0.24.0,<1.0.0",
    "peft>=0.18.0,<1.0.0",
    "qwen-vl-utils>=0.0.14",
    "Pillow>=9.4.0",
    "scikit-learn>=1.3.0",
    "tensorboard",
    "wandb",
    "rich",
    "hf_transfer",
    "ipywidgets",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
